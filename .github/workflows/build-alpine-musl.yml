
name: Build LightSpeed Proxy for Alpine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. 获取官方 v1.12.5 源码
      - name: Checkout LightSpeed v1.12.5
        uses: actions/checkout@v4
        with:
          repository: ShibbityShwab/lightspeed
          ref: v1.12.5
          fetch-depth: 1

      # 2. 修复 musl 平台 libc 类型兼容问题
      - name: Patch musl libc type compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 修复 relay.rs
          relay = Path("proxy/src/relay.rs")
          source = relay.read_text()

          old = "libc::MSG_DONTWAIT,"
          count = source.count(old)

          if count != 1:
              raise SystemExit(
                  f"relay.rs: expected 1 MSG_DONTWAIT occurrence, found {count}"
              )

          source = source.replace(
              old,
              "libc::MSG_DONTWAIT as _,",
              1
          )

          relay.write_text(source)
          print("relay.rs: patched successfully")

          # 修复 trace.rs
          trace = Path("proxy/src/trace.rs")
          source = trace.read_text()

          pattern = r"(?m)^(\s*)message\.msg_controllen\s*=\s*control\.len\(\)\s*;"

          source, count = re.subn(
              pattern,
              r"\1message.msg_controllen = control.len() as _;",
              source
          )

          if count != 1:
              raise SystemExit(
                  f"trace.rs: expected 1 msg_controllen assignment, found {count}"
              )

          trace.write_text(source)
          print("trace.rs: patched successfully")

          print("All musl compatibility patches applied.")
          PY

      # 3. 安装 musl 编译工具
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # 4. 安装 Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 5. 安装 musl 编译目标
      - name: Add musl target
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target list --installed
          rustc --version

      # 6. 编译 LightSpeed Proxy
      - name: Build proxy
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release \
            --target x86_64-unknown-linux-musl \
            -p lightspeed-proxy \
            --features quic

      # 7. 打包并生成 SHA256
      - name: Package and verify
        run: |
          mkdir -p dist/lightspeed-proxy-x86_64-unknown-linux-musl

          cp target/x86_64-unknown-linux-musl/release/lightspeed-proxy \
            dist/lightspeed-proxy-x86_64-unknown-linux-musl/

          cp LICENSE CHANGELOG.md README.md \
            dist/lightspeed-proxy-x86_64-unknown-linux-musl/

          file dist/lightspeed-proxy-x86_64-unknown-linux-musl/lightspeed-proxy

          tar -cJf dist/lightspeed-proxy-v1.12.5-x86_64-unknown-linux-musl.tar.xz \
            -C dist lightspeed-proxy-x86_64-unknown-linux-musl

          cd dist

          sha256sum lightspeed-proxy-v1.12.5-x86_64-unknown-linux-musl.tar.xz \
            > lightspeed-proxy-v1.12.5-x86_64-unknown-linux-musl.tar.xz.sha256

      # 8. 上传编译产物
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightspeed-proxy-alpine-musl-v1.12.5
          path: |
            dist/lightspeed-proxy-v1.12.5-x86_64-unknown-linux-musl.tar.xz
            dist/lightspeed-proxy-v1.12.5-x86_64-unknown-linux-musl.tar.xz.sha256
          retention-days: 7
